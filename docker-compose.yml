secrets:
  composer_auth:
    file: ${COMPOSER_AUTH_FILE:-./auth.json.stub}

services:
  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # App
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
      secrets:
        - composer_auth
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH:-}
        VITE_APP_NAME: ${APP_NAME:-CodeWithDiki Toko Online}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-laravel-herd}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-80}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      REDIS_HOST: redis
      REVERB_HOST: ${APP_DOMAIN:-localhost}
      REVERB_PORT: "80"
      REVERB_SCHEME: http
    volumes:
      - app_storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    networks:
      - backend
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/public/build/manifest.json"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx (Bridge: Frontend ↔ Backend)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      target: webserver
      secrets:
        - composer_auth
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH:-}
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_DOMAIN: ${APP_DOMAIN:-localhost}
      NGINX_APP_HOST: app
      NGINX_REVERB_HOST: reverb
      NGINX_REVERB_PORT: "8080"
    volumes:
      - app_storage:/var/www/html/storage:ro
      - public_build:/var/www/html/public/build:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Certbot
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    profiles: [ssl]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - frontend
    command: ["--help"]

  # ---------------------------------------------------------------------------
  # Horizon
  # ---------------------------------------------------------------------------
  horizon:
    build:
      context: .
      target: runtime
      secrets:
        - composer_auth
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH:-}
    env_file: .env
    environment:
      CONTAINER_ROLE: horizon
      REDIS_HOST: redis
    volumes:
      - app_storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Reverb
  # ---------------------------------------------------------------------------
  reverb:
    build:
      context: .
      target: runtime
      secrets:
        - composer_auth
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH:-}
    env_file: .env
    environment:
      CONTAINER_ROLE: reverb
      REDIS_HOST: redis
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8080"
      REVERB_HOST: ${APP_DOMAIN:-localhost}
      REVERB_PORT: "80"
      REVERB_SCHEME: http
    volumes:
      - app_storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MySQL
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-toko_online}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  redis_data:
  app_storage:
  public_build:
  certbot_certs:
  certbot_www:
  mysql_data:
