server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Increase timeouts for long-running requests / file uploads
    client_max_body_size 100M;
    fastcgi_read_timeout 120s;

    # ---------------------------------------------------------------------------
    # Reverb WebSocket — proxy to the reverb container on port 8080
    # Matches Pusher-protocol paths: /app/{key} and /apps/{id}/events
    # ---------------------------------------------------------------------------
    location ~ ^/(app|apps)/ {
        proxy_pass 127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # Static assets — served directly from the nginx image (baked-in public/build)
    # Falls through to PHP if file doesn't physically exist (e.g. Livewire, Horizon JS)
    # ---------------------------------------------------------------------------
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # Storage symlink — serve user-uploaded files
    # ---------------------------------------------------------------------------
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # PHP application
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
